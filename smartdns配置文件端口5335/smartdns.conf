#dns监听端口
bind [::]:5335

#bootstrap DNS
server tls://223.5.5.5 -bootstrap-dns
server tls://119.29.29.29 -bootstrap-dns
server tls://223.6.6.6 -bootstrap-dns
server tls://8.8.8.8 -bootstrap-dns

### Default Group 默认分组，保证非CN域名正常解析（国外DOH大多数已经被封禁）
server-https https://1.0.0.1/dns-query
server-https https://1.1.1.1/dns-query
server-https https://8.8.8.8/dns-query
server-https https://8.8.4.4/dns-query
server 1.0.0.1
server 8.8.4.4
server 1.1.1.1
server 8.8.8.8

### Domestic Group 用于解析 CN 域名,添加edns子网
server 202.96.128.166 -group domestic -exclude-default-group -subnet 59.41.161.0/24,240e:3b6:c9a::/48
server 202.96.134.133 -group domestic -exclude-default-group -subnet 59.41.161.0/24,240e:3b6:c9a::/48
server-https https://223.5.5.5/dns-query -group domestic -exclude-default-group -subnet 59.41.161.0/24,240e:3b6:c9a::/48
server-https https://223.6.6.6/dns-query -group domestic -exclude-default-group -subnet 59.41.161.0/24,240e:3b6:c9a::/48

#配置分流规则,如果''里面没有对应文件会报错
domain-set -name cn -file '/data/other_vol/china-list.txt'
domain-rules /domain-set:cn/ -nameserver domestic

#测速模式
speed-check-mode ping,tcp:80,tcp:443

#双栈优选，优先选用ipv4
dualstack-ip-selection yes
dualstack-ip-selection-threshold 15

#缓存预获取
prefetch-domain yes

#乐观缓存
serve-expired yes

#DNS缓存持久化
cache-size 30000
cache-persist yes
cache-file /data/other_vol/smartdns/cache
cache-checkpoint-time 3600

#配置过期缓存响应TTL
serve-expired-reply-ttl 5

# 开启过期缓存服务 (即刻响应过期缓存，后台异步更新)
serve-expired yes
serve-expired-ttl 30000
serve-expired-reply-ttl 3

# 所有资源记录的 TTL
rr-ttl-min 600
rr-ttl-max 86400
rr-ttl-reply-max 60
